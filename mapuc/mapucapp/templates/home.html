<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de filmes</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 20px; background: #f4f6f8; }
    .topo { display: flex; justify-content: space-between; align-items: center; }
    .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 14px; }
    .card img { width: 100%; border-radius: 8px; }
    .acoes { display: flex; gap: 8px; margin-top: 10px; }
    .acoes form { margin: 0; }
    .btn { display: inline-block; padding: 8px 12px; border-radius: 8px; border: none;
           background: #41508c; color: #fff; text-decoration: none; font-size: 14px; cursor: pointer; }
    .btn.perigo { background: #d64545; }
  </style>
</head>
<body>
  <div class="topo">
    <h1>Catálogo de filmes</h1>
    <a class="btn" href="{% url 'criar_filme' %}">+ Novo filme</a>
  </div>

  <div class="grade">
    {% for movie in movies %}
      <div class="card">
        <img src="{{ movie.image_url }}" alt="{{ movie.title }}">
        <h3>{{ movie.title }}</h3>
        <p>{{ movie.description }}</p>

        <div class="acoes">
          <a class="btn" href="{% url 'editar_filme' movie.pk %}">Atualizar</a>
          <form method="POST" action="{% url 'deletar_filme' movie.pk %}"
                onsubmit="return confirm('Deletar {{ movie.title|escapejs }}?');">
            {% csrf_token %}
            <button type="submit" class="btn perigo">Deletar</button>
          </form>
        </div>
      </div>
    {% empty %}
      <p>Nenhum filme cadastrado ainda.</p>
    {% endfor %}
  </div>
</body>
</html>
